<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>grabfold — plain JavaScript</title>
<link rel="stylesheet" href="../shared/demo.css">
<style>.strip { max-width: 820px; margin: 16px auto 0; color: #8a4b12; } .sound button { font: inherit; padding: 2px 10px; border-radius: 8px; border: 1px solid #b9b3a4; background: #fffdf8; cursor: pointer; }</style>
</head>
<body>
  <main class="demo">
    <header>
      <h1>grabfold</h1>
      <p>Take hold of a page <strong>anywhere</strong> and pull it across. Hold it high or low, and move your hand up or down as you go.</p>
    </header>

    <div id="book" class="book"></div>

    <nav class="controls" aria-label="Pages">
      <button type="button" id="prev">← Previous</button>
      <span id="where" aria-live="polite"></span>
      <button type="button" id="next">Next →</button>
    </nav>
    <p class="jump">
      <label>Jump to
        <select id="jump"></select>
      </label>
      <small>— several pages in a single turn</small>
    </p>
    <p class="sound">
      <label>Covers
        <select id="covers">
          <option value="hard" selected>Hard</option>
          <option value="inside">Inside only</option>
          <option value="none">None</option>
        </select>
      </label>
      <label><input type="checkbox" id="sound-on" checked> Sound</label>
      <label>Volume <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7"></label>
    </p>
    <p class="sound">
      <label>Binding
        <select id="binding">
          <option value="left" selected>Left</option>
          <option value="right">Right (right to left)</option>
          <option value="top">Top (calendar)</option>
        </select>
      </label>
      <label>Thickness <input type="range" id="thickness" min="0" max="24" step="1" value="10"></label>
      <label><input type="checkbox" id="peek" checked> Peek</label>
      <label><input type="checkbox" id="flick" checked> Flick</label>
      <button type="button" id="full">Fullscreen</button>
    </p>
    <div id="strip" class="strip" aria-label="Openings"></div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
