<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>grabfold — a PDF, curled in WebGL</title>
<link rel="stylesheet" href="../shared/demo.css">
<style>
  .book { max-width: 900px; filter: drop-shadow(0 18px 24px rgba(40, 32, 20, 0.28)); }
  .book canvas.pdf { display: block; width: 100%; height: 100%; }
  .strip { max-width: 900px; margin: 18px auto 0; color: #8a4b12; }
  .loading { text-align: center; color: #8f8878; }
</style>
</head>
<body>
  <main class="demo">
    <header>
      <h1>A PDF, <small>curled in WebGL</small></h1>
      <p>Pages rendered with pdf.js, turned by grabfold with <code>grabfold/webgl</code>. Double-click, pinch or Ctrl + wheel to zoom; <kbd>Esc</kbd> zooms out.</p>
    </header>
    <p class="loading" id="loading">Loading the PDF…</p>
    <div id="book" class="book"></div>
    <nav class="controls" aria-label="Pages">
      <button type="button" id="prev">← Previous</button>
      <span id="where" class="where" aria-live="polite"></span>
      <button type="button" id="next">Next →</button>
      <button type="button" id="full">Fullscreen</button>
    </nav>
    <p class="sound">
      <label><input type="checkbox" id="curl" checked> WebGL curl</label>
      <label><input type="checkbox" id="sound-on" checked> Sound</label>
    </p>
    <div id="strip" class="strip" aria-label="Pages"></div>
  </main>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
