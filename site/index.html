<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 6h11v20H4z' fill='%231f4f5a'/%3E%3Cpath d='M17 6h11v20H17z' fill='%23e9a23b'/%3E%3C/svg%3E">
<title>grabfold — a page-turn you can grab anywhere</title>
<meta name="description" content="A realistic page-turn for the web: the page folds from the exact point you take hold of it. Zero dependencies, with React, Vue, Svelte and Web Component adapters.">
<link rel="stylesheet" href="./examples/shared/demo.css">
<link rel="stylesheet" href="./site.css">
</head>
<body>
  <header class="hero">
    <h1>grabfold</h1>
    <p>A page-turn you can <strong>grab anywhere</strong>. The page folds from the exact point you take hold of it, and the crease tilts with your hand.</p>
    <p class="links">
      <a href="https://github.com/JavocSoft/grabfold">GitHub</a>
      <a href="https://www.npmjs.com/package/grabfold">npm</a>
      <a href="./examples/">Examples</a>
    </p>
    <pre class="install"><code>npm install grabfold</code></pre>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Live book">
      <div id="book" class="book"></div>
      <nav class="controls" aria-label="Pages">
        <button type="button" id="prev">← Previous</button>
        <span id="where" class="where" aria-live="polite"></span>
        <button type="button" id="next">Next →</button>
      </nav>
    </section>

    <form class="panel" id="panel" aria-label="Options">
      <fieldset>
        <legend>Book</legend>
        <label>Covers
          <select name="covers"><option value="hard">hard</option><option value="inside" selected>inside</option><option value="none">none</option></select>
        </label>
        <label>Binding
          <select name="binding"><option value="left" selected>left</option><option value="right">right</option><option value="top">top</option></select>
        </label>
        <label>Layout
          <select name="layout"><option value="auto" selected>auto</option><option value="spread">spread</option><option value="single">single</option></select>
        </label>
        <label>Page ratio <output name="pageRatioOut"></output>
          <input type="range" name="pageRatio" min="0.5" max="1.5" step="0.05" value="0.75">
        </label>
        <label>Thickness <output name="thicknessOut"></output>
          <input type="range" name="thickness" min="0" max="24" step="1" value="10">
        </label>
      </fieldset>
      <fieldset>
        <legend>Feel</legend>
        <label>Duration <output name="durationOut"></output>
          <input type="range" name="duration" min="200" max="1600" step="20" value="680">
        </label>
        <label>Shadow <output name="shadowOut"></output>
          <input type="range" name="shadow" min="0" max="1" step="0.05" value="0.4">
        </label>
        <label>Gutter <output name="gutterOut"></output>
          <input type="range" name="gutter" min="0" max="1" step="0.05" value="0.3">
        </label>
        <label>Lift <output name="liftOut"></output>
          <input type="range" name="lift" min="0" max="100" step="5" value="45">
        </label>
      </fieldset>
      <fieldset class="checks">
        <legend>Hands</legend>
        <label><input type="checkbox" name="gestures" checked> Gestures</label>
        <label><input type="checkbox" name="peek" checked> Peek</label>
        <label><input type="checkbox" name="flick" checked> Flick</label>
        <label><input type="checkbox" name="grabBlock" checked> Grab a block</label>
        <label><input type="checkbox" name="center" checked> Centre closed</label>
        <label><input type="checkbox" name="sound" checked> Sound</label>
      </fieldset>
    </form>
  </main>

  <section class="code" aria-label="Code">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="js" aria-selected="true">JavaScript</button>
      <button type="button" role="tab" data-tab="react" aria-selected="false">React</button>
      <button type="button" role="tab" data-tab="vue" aria-selected="false">Vue</button>
      <button type="button" role="tab" data-tab="element" aria-selected="false">Web Component</button>
      <button type="button" class="copy" id="copy">Copy</button>
    </div>
    <pre><code id="code"></code></pre>
  </section>

  <footer class="foot">
    <p><a href="https://github.com/JavocSoft/grabfold/blob/main/LICENSE">MIT</a> © JavocSoft · <a href="https://github.com/JavocSoft/grabfold">github.com/JavocSoft/grabfold</a></p>
  </footer>

  <script type="module" src="./site.js"></script>
</body>
</html>
